# OpenCode (sst/opencode).
# Skills:   .opencode/skills/<name>/SKILL.md — OpenCode also auto-discovers
#           .claude/skills/*/SKILL.md and .agents/skills/*/SKILL.md along the
#           directory tree, but we project into its own namespaced dir.
# Agents:   .opencode/agents/<name>.md — frontmatter controls mode
#           (primary/subagent/all), model, tools, and permissions; the body
#           becomes the system prompt. Our frontmatter (skills:/delegates_to:)
#           is carried through as reference — map it to
#           OpenCode's mode/tools/permission keys if you want the file to
#           behave as a first-class OpenCode agent rather than documentation.
# Project context: AGENTS.md at the project root, found by traversing up from
#           the current directory (OpenCode also reads CLAUDE.md if present).
SKILLS_DIR=".opencode/skills"
AGENTS_DIR=".opencode/agents"
INSTRUCTIONS_FILE="AGENTS.md"
ALSO_AGENTS_MD="false"
AGENT_FILE_EXT="md"
