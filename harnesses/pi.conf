# Pi (earendil-works/pi coding-agent harness).
# Skills:   .pi/skills/<name>/SKILL.md — Pi also auto-discovers
#           .agents/skills/*/SKILL.md along the directory tree up to the git
#           root, plus global skills under ~/.pi/agent/skills/ and
#           ~/.agents/skills/; we project into its own namespaced project dir.
# Agents:   .pi/agents/<name>.md — Pi requires name/description in
#           frontmatter to discover a subagent; the body becomes its prompt.
#           Our frontmatter (role:/skills:/delegates_to:)
#           is carried through as reference — add a description: field (or
#           rename role: to description:) if you want Pi to treat the file as
#           a first-class subagent rather than documentation.
# Project context: AGENTS.md, loaded from the current directory, parent
#           directories, and ~/.pi/agent/.
SKILLS_DIR=".pi/skills"
AGENTS_DIR=".pi/agents"
INSTRUCTIONS_FILE="AGENTS.md"
ALSO_AGENTS_MD="false"
AGENT_FILE_EXT="md"
